<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1120" viewBox="0 0 1500 1120">
<defs><style>
.title{font:700 29px Arial,sans-serif;fill:#14233b}.sub{font:400 14px Arial,sans-serif;fill:#64748b}.h{font:700 18px Arial,sans-serif;fill:#172b4d}.body{font:400 12px Arial,sans-serif;fill:#344563}.small{font:400 10px Arial,sans-serif;fill:#64748b}.pill{font:700 10px Arial,sans-serif;fill:#175cd3}.white{fill:#fff}
</style></defs>
<rect width="1500" height="1120" fill="#f4f7fb"/>
<text x="40" y="48" class="title">FLOW SUPPORT CHAT — SUPPORT DASHBOARD</text>
<text x="40" y="74" class="sub">Screen concepts 01–03 · Queue, agent workspace, Ticket context · Design proposal v0.2</text>
<rect x="1260" y="28" width="195" height="30" rx="15" fill="#e0edff"/><text x="1357" y="47" text-anchor="middle" class="pill">AGENT EXPERIENCE</text>
<!-- screen 1 -->
<rect x="30" y="105" width="460" height="950" rx="16" fill="#fff" stroke="#d8e1ee"/>
<text x="52" y="140" class="h">01 · Conversation queue</text><text x="52" y="160" class="small">Triage new requests and choose the next conversation</text>
<rect x="48" y="180" width="424" height="825" rx="9" fill="#f8fafc" stroke="#d8e1ee"/>
<rect x="48" y="180" width="424" height="54" rx="9" fill="#fff"/><path d="M48 234 H472" stroke="#d8e1ee"/>
<rect x="63" y="194" width="25" height="25" rx="6" fill="#155eef"/><path d="M70 207 h11 M75 202 v10" stroke="#fff" stroke-width="2"/><text x="98" y="204" class="body" font-weight="700">Support Desk</text><text x="98" y="220" class="small">Agent workspace</text><circle cx="433" cy="207" r="12" fill="#e0edff"/><text x="433" y="211" text-anchor="middle" class="body">A</text>
<rect x="62" y="250" width="396" height="38" rx="7" fill="#fff" stroke="#cbd5e1"/><text x="76" y="273" class="small">⌕  Search conversations...</text>
<rect x="62" y="300" width="396" height="34" rx="7" fill="#e8efff"/><text x="76" y="321" class="body" font-weight="700">All conversations</text><text x="436" y="321" text-anchor="end" class="body">24</text>
<text x="68" y="360" class="small">MY QUEUE</text>
<rect x="62" y="372" width="396" height="82" rx="8" fill="#fff" stroke="#155eef" stroke-width="1.5"/><circle cx="87" cy="398" r="14" fill="#dbeafe"/><text x="87" y="402" text-anchor="middle" class="body">L</text><text x="111" y="393" class="body" font-weight="700">Linh Nguyen</text><text x="111" y="410" class="small">Cannot access account</text><text x="111" y="429" class="small">Technical · 2 min ago</text><rect x="370" y="384" width="72" height="19" rx="9" fill="#fef3c7"/><text x="406" y="397" text-anchor="middle" font-family="Arial" font-size="9" fill="#92400e">Waiting</text>
<rect x="62" y="462" width="396" height="82" rx="8" fill="#fff" stroke="#e2e8f0"/><circle cx="87" cy="488" r="14" fill="#f3e8ff"/><text x="87" y="492" text-anchor="middle" class="body">M</text><text x="111" y="483" class="body" font-weight="700">Minh Tran</text><text x="111" y="500" class="small">Question about service plan</text><text x="111" y="519" class="small">Sales · 8 min ago</text><rect x="370" y="474" width="72" height="19" rx="9" fill="#dcfae6"/><text x="406" y="487" text-anchor="middle" font-family="Arial" font-size="9" fill="#067647">Assigned</text>
<rect x="62" y="552" width="396" height="82" rx="8" fill="#fff" stroke="#e2e8f0"/><circle cx="87" cy="578" r="14" fill="#dcfae6"/><text x="87" y="582" text-anchor="middle" class="body">P</text><text x="111" y="573" class="body" font-weight="700">Phuong Le</text><text x="111" y="590" class="small">Invoice clarification</text><text x="111" y="609" class="small">Other · 15 min ago</text><rect x="370" y="564" width="72" height="19" rx="9" fill="#f2f4f7"/><text x="406" y="577" text-anchor="middle" font-family="Arial" font-size="9" fill="#344054">Unassigned</text>
<text x="68" y="670" class="small">TRIAGE / NEEDS ATTENTION</text>
<rect x="62" y="682" width="396" height="82" rx="8" fill="#fff" stroke="#e2e8f0"/><circle cx="87" cy="708" r="14" fill="#fee4e2"/><text x="87" y="712" text-anchor="middle" class="body">T</text><text x="111" y="703" class="body" font-weight="700">Ticket sync check</text><text x="111" y="720" class="small">Formal Ticket not verified</text><text x="111" y="739" class="small">System event · 22 min ago</text><rect x="365" y="694" width="77" height="19" rx="9" fill="#fee4e2"/><text x="403" y="707" text-anchor="middle" font-family="Arial" font-size="9" fill="#b42318">Review</text>
<text x="68" y="810" class="small">Filters: team · status · channel · age · priority</text><text x="52" y="970" class="body">Primary action: open a conversation</text><text x="52" y="990" class="small">Never hide unassigned or reconciliation items from authorized leads.</text>
<!-- screen 2 -->
<rect x="520" y="105" width="460" height="950" rx="16" fill="#fff" stroke="#d8e1ee"/>
<text x="542" y="140" class="h">02 · Agent conversation workspace</text><text x="542" y="160" class="small">Respond, use AI suggestions, and manage handoff</text>
<rect x="538" y="180" width="424" height="825" rx="9" fill="#f8fafc" stroke="#d8e1ee"/>
<rect x="538" y="180" width="424" height="64" rx="9" fill="#fff"/><path d="M538 244 H962" stroke="#d8e1ee"/>
<circle cx="565" cy="207" r="15" fill="#dbeafe"/><text x="565" y="211" text-anchor="middle" class="body">L</text><text x="590" y="203" class="body" font-weight="700">Linh Nguyen</text><text x="590" y="220" class="small">Conversation CONV-1042 · Technical</text><rect x="841" y="193" width="102" height="28" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="892" y="211" text-anchor="middle" class="small">More actions</text>
<rect x="555" y="262" width="250" height="54" rx="10" fill="#e8efff"/><text x="570" y="284" class="body">I cannot access my account.</text><text x="570" y="302" class="small">Customer · 09:41</text>
<rect x="665" y="333" width="276" height="68" rx="10" fill="#fff" stroke="#d8e1ee"/><text x="680" y="355" class="body">Have you tried signing in from</text><text x="680" y="373" class="body">another browser or private window?</text><text x="680" y="390" class="small">Agent · 09:43</text>
<rect x="555" y="418" width="250" height="54" rx="10" fill="#e8efff"/><text x="570" y="440" class="body">Same issue in both browsers.</text><text x="570" y="458" class="small">Customer · 09:44</text>
<rect x="555" y="493" width="386" height="132" rx="10" fill="#f0f9ff" stroke="#b9e6fe"/><text x="572" y="516" class="body" font-weight="700">AI assist · Suggested next reply</text><text x="572" y="539" class="body">Ask the customer to confirm the exact</text><text x="572" y="557" class="body">error message and verify account status</text><text x="572" y="575" class="body">before initiating a password reset.</text><rect x="572" y="588" width="104" height="24" rx="6" fill="#155eef"/><text x="624" y="604" text-anchor="middle" class="btn" font-size="10">Insert draft</text><rect x="684" y="588" width="104" height="24" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="736" y="604" text-anchor="middle" class="small">Regenerate</text>
<rect x="555" y="645" width="386" height="105" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="571" y="667" class="small">Reply to customer</text><text x="571" y="690" class="body">Please share the exact error message...</text><path d="M571 706 H925" stroke="#e2e8f0"/><text x="571" y="731" class="small">Attach · Internal note toggle · Send</text>
<rect x="818" y="765" width="123" height="35" rx="7" fill="#155eef"/><text x="879" y="787" text-anchor="middle" class="btn">Send reply</text>
<rect x="555" y="818" width="386" height="70" rx="8" fill="#fffaeb" stroke="#fedf89"/><text x="571" y="841" class="body" font-weight="700">Internal note (staff only)</text><text x="571" y="861" class="small">Never rendered in the customer transcript.</text>
<text x="542" y="970" class="body">Primary action: send a verified reply</text><text x="542" y="990" class="small">AI draft is advisory; the agent reviews before sending.</text>
<!-- screen 3 -->
<rect x="1010" y="105" width="460" height="950" rx="16" fill="#fff" stroke="#d8e1ee"/>
<text x="1032" y="140" class="h">03 · Customer context & Ticket</text><text x="1032" y="160" class="small">Verify customer details and formal tracking status</text>
<rect x="1028" y="180" width="424" height="825" rx="9" fill="#f8fafc" stroke="#d8e1ee"/>
<rect x="1028" y="180" width="424" height="54" rx="9" fill="#fff"/><path d="M1028 234 H1452" stroke="#d8e1ee"/><text x="1048" y="212" class="body" font-weight="700">Customer &amp; Ticket details</text>
<rect x="1045" y="250" width="390" height="150" rx="10" fill="#fff" stroke="#d8e1ee"/><circle cx="1080" cy="282" r="19" fill="#dbeafe"/><text x="1080" y="286" text-anchor="middle" class="body">L</text><text x="1110" y="278" class="body" font-weight="700">Linh Nguyen</text><text x="1110" y="296" class="small">Customer ID: verified by backend</text><path d="M1062 316 H1418" stroke="#e2e8f0"/><text x="1062" y="338" class="small">Channel</text><text x="1175" y="338" class="body">Browser Extension</text><text x="1062" y="360" class="small">Category</text><text x="1175" y="360" class="body">Technical support</text><text x="1062" y="382" class="small">Conversation</text><text x="1175" y="382" class="body">CONV-1042</text>
<rect x="1045" y="416" width="390" height="172" rx="10" fill="#fff" stroke="#d8e1ee"/><text x="1062" y="442" class="body" font-weight="700">AI summary</text><rect x="1350" y="427" width="65" height="20" rx="10" fill="#e0edff"/><text x="1382" y="441" text-anchor="middle" class="pill">Draft</text><text x="1062" y="466" class="body">Customer cannot sign in from two browsers.</text><text x="1062" y="488" class="body">Exact error and account state still unknown.</text><text x="1062" y="510" class="small">Suggested intent: account access</text><text x="1062" y="532" class="small">Suggested team: Technical (verify routing rule)</text><text x="1062" y="562" class="small">AI summary is advisory, not an assignment decision.</text>
<rect x="1045" y="604" width="390" height="164" rx="10" fill="#fff" stroke="#d8e1ee"/><text x="1062" y="630" class="body" font-weight="700">Bitrix24 Ticket</text><rect x="1062" y="645" width="355" height="37" rx="7" fill="#fffaeb" stroke="#fedf89"/><circle cx="1078" cy="663" r="4" fill="#d97706"/><text x="1090" y="667" class="body">No verified Ticket link yet</text><text x="1062" y="706" class="small">Conversation may exist without a Ticket.</text><text x="1062" y="725" class="small">Create/link only when configured policy requires it.</text><rect x="1062" y="736" width="150" height="23" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="1137" y="751" text-anchor="middle" class="small">Check sync status</text>
<rect x="1045" y="784" width="390" height="96" rx="10" fill="#fff" stroke="#d8e1ee"/><text x="1062" y="809" class="body" font-weight="700">Assignment &amp; SLA</text><text x="1062" y="832" class="small">Assigned agent: current authorized owner</text><text x="1062" y="851" class="small">SLA: shown only when policy is configured</text><text x="1062" y="869" class="small">Private fields are permission-checked server-side.</text>
<text x="1032" y="970" class="body">Primary action: verify context and Ticket linkage</text><text x="1032" y="990" class="small">Never claim a Ticket exists until the backend verifies the link.</text>
</svg>